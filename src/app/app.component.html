<main class="page-shell">
  <section class="hero">
    <div>
      <p class="eyebrow">BTS Pack Builder Prototype</p>
      <h1>Products grouped by subject</h1>
      <p class="intro">Drag a product row into another subject. Double-click a subject name to rename it. Subjects themselves cannot be dragged.</p>
    </div>
    <div class="legend">
      <span>↕ Product = movable</span>
      <span>📁 Subject = fixed</span>
    </div>
  </section>

  <section class="grid-card">
    <ag-grid-angular
      style="width: 100%; height: 620px;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [autoGroupColumnDef]="autoGroupColumnDef"
      [groupDefaultExpanded]="groupDefaultExpanded"
      [rowDragManaged]="rowDragManaged"
      [suppressMoveWhenRowDragging]="suppressMoveWhenRowDragging"
      [animateRows]="animateRows"
      [getRowId]="getRowId"
      (gridReady)="onGridReady($event)"
      (rowDragEnd)="onRowDragEnd($event)"
      (cellDoubleClicked)="onCellDoubleClicked($event)">
    </ag-grid-angular>
  </section>
</main>
